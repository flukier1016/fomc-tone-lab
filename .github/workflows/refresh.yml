name: Refresh and deploy
# Pull new Fed documents and market data, score what is new with Claude, and roll the read-only demo out on Cloud Run
# (https://fedtone.web.app). Runs every evening after the 3:30 p.m. Treasury fix and the day's Fed releases, at
# 2:25 p.m. in New York on the afternoon of a statement or minutes (so the reading is up within the hour), on every
# push to main that touches the app, and by hand. The research results stay as reported: the run stops after the
# audit stage, so the event study, the backtest and the next-decision test are not recomputed; the forward test then
# runs their frozen rules on whatever is new (data/forward/rules.json).
on:
  schedule:
    - cron: "30 23 * * *" # 7:30 p.m. in New York during daylight time, 6:30 p.m. in winter
    - cron: "25 18 * * 1-5" # 2:25 p.m. in daylight time, release days only (see the due job)
    - cron: "25 19 * * 1-5" # 2:25 p.m. in winter, release days only
  push:
    branches: [main]
    paths: ["src/**", "config/**", "deploy/**", "requirements*.txt", "requirements.lock", ".github/workflows/refresh.yml"]
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write # commit new Claude records
  id-token: write # keyless sign-in to Google Cloud (workload identity federation)

env:
  PROJECT: fomc-tone-lab-2026
  HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

jobs:
  due:
    # The afternoon schedules run only when a statement or minutes came out at 2 p.m. today; everything else runs.
    # Only the working repository deploys: a public copy or fork holds no key and no cloud access, so it skips.
    if: github.repository == 'flukier1016/fomc-tone-duration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "30 23 * * *" ]; then
            python3 deploy/release_day.py >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (the locked versions)
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Restore downloads (Fed pages, market files, the embedding model)
        uses: actions/cache/restore@v6
        with:
          path: |
            data/raw
            data/processed
          key: fomc-downloads-${{ github.run_id }}
          restore-keys: fomc-downloads-
      - name: Start from the shipped store
        run: mkdir -p data && gunzip -c deploy/fomc.db.gz > data/fomc.db
      - name: New documents and market data
        run: fomc run --until audit
      - name: Score what is new with Claude
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          fomc llm-update --max 40
          fomc drift
          fomc run --start llm-sync --until audit
      - name: The frozen rules on new data (forward test)
        run: fomc forward
      - name: Commit new Claude records
        run: |
          git add data/llm
          if git diff --cached --quiet; then echo "no new records"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Score new Fed documents (scheduled run)"
          git pull --rebase && git push
      - name: Keep the downloads for the next run, whatever happens next
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            data/raw
            data/processed
          key: fomc-downloads-${{ github.run_id }}
      - name: Snapshot the store
        run: make deploy-snapshot FOMC=fomc
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/374765727133/locations/global/workloadIdentityPools/github/providers/fomc-repo
          service_account: deployer@fomc-tone-lab-2026.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and roll out on Cloud Run
        # an explicit staging directory: the default one makes gcloud list every bucket in the project first
        run: gcloud builds submit --config deploy/cloudbuild.yaml --project "$PROJECT" --gcs-source-staging-dir "gs://${PROJECT}_cloudbuild/source" .
      - name: Check the live demo
        run: |
          sleep 20
          curl -fsS https://fedtone.web.app/api/health
      - name: Fail loudly if anything a refresh should bring is missing
        # after the deploy, so the site stays as fresh as it can; a failed run emails the repository owner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: fomc doctor --strict
